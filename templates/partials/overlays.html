{# toast de compras recientes, botón de WhatsApp y píldora del cupón — contenedor sticky de altura 0 igual al diseño #}
<div style="position:sticky;bottom:0;height:0;z-index:45" data-overlays="1"
     data-toast-on="{% if overlay_toast %}1{% endif %}"
     data-promo-on="{% if overlay_promo %}1{% endif %}">
  <div data-toast="1" data-enter="toast" hidden style="position:absolute;left:var(--pad);bottom:16px;width:var(--toastW);display:flex;align-items:center;gap:10px;padding:10px 6px 12px 10px;border-radius:8px;background:rgba(252,248,243,.97);color:#011E4F;box-shadow:0 18px 40px -12px rgba(0,0,0,.55);overflow:hidden">
    <div data-toast-cover="1" style="width:34px;aspect-ratio:3/4;border-radius:4px;flex-shrink:0"></div>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#4A5A78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span data-toast-flag="1" style="width:16px;height:11px;border-radius:2px;flex-shrink:0;box-shadow:0 0 0 1px rgba(1,30,79,.15)"></span><span data-toast-who="1"></span></div>
      <div style="font-size:13px;font-weight:700;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">compró <span data-toast-title="1"></span></div>
      <div style="font-size:11px;color:#4A5A78"><span data-toast-when="1"></span> · compra verificada</div>
    </div>
    <button type="button" data-toast-close="1" aria-label="Cerrar" style="width:30px;height:30px;flex-shrink:0;border:0;background:transparent;cursor:pointer;font-size:18px;color:#4A5A78">×</button>
    <span data-progress="t0" data-duration="6500" style="position:absolute;left:0;bottom:0;height:2px;width:100%;background:linear-gradient(90deg,#FC3C00,#FC5F01 35%,#FC8B01 70%,#FCC602);transform-origin:0 50%;opacity:.8"></span>
  </div>
  <a href="{{ whatsapp_float_link }}" target="_blank" rel="noopener" aria-label="WhatsApp" data-magnetic="1" style="position:absolute;right:var(--pad);bottom:16px;width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -10px rgba(37,211,102,.8)"><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 1.9 1.1 1 2 1.3 2.3 1.4.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.4.2.5.3.1.2.1.7-.2 1.4z"/></svg></a>
  {% if promo %}
  <div data-promo="1" data-enter="toast" hidden style="position:absolute;right:calc(var(--pad) + 66px);bottom:18px">
    <div data-float="1">
      <button type="button" data-promo-copy="{{ promo.code }}" data-burst="" title="Copiar cupón" style="height:52px;padding:0 16px 0 10px;border:0;border-radius:999px;background:linear-gradient(90deg,#FC3C00,#FC5F01 35%,#FC8B01 70%,#FCC602);color:#011E4F;box-shadow:0 14px 30px -10px rgba(252,95,1,.75);display:flex;align-items:center;gap:10px;cursor:pointer;font:italic 900 14px/1 'Archivo',sans-serif;text-transform:uppercase;white-space:nowrap"><span style="width:32px;height:32px;border-radius:50%;background:#011E4F;color:#FCC602;display:flex;align-items:center;justify-content:center;font:normal 900 14px/1 'Archivo',sans-serif">%</span><span data-promo-label="1" data-short="{{ promo.code }}" data-long="{{ promo.label }}">{{ promo.label }}</span></button>
    </div>
    <button type="button" data-promo-close="1" aria-label="Cerrar promoción" style="position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#FCF8F3;color:#011E4F;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3)">×</button>
  </div>
  {% endif %}
</div>
<script type="application/json" id="gj-toast-data">{{ toast_json|safe }}</script>
