<div style="display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#FCC602"><span style="width:24px;height:4px;background:#FCC602;transform:skewX(-20deg)"></span>{{ kicker }}</div>
  <h1 style="margin:0;font:italic 900 var(--detailH1)/1 'Archivo',sans-serif;font-stretch:115%;text-transform:uppercase">{{ title }}</h1>
  <p style="margin:0;font-size:15px;line-height:22px;color:#C9D4E8;max-width:{{ maxw|default:'540px' }};text-wrap:pretty">{{ lead }}</p>
</div>
