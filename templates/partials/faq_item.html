<div data-faq-item="1" style="border-bottom:1px solid rgba(252,248,243,.15)">
  <button type="button" data-faq-toggle="1" aria-expanded="{% if forloop.first %}true{% else %}false{% endif %}" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:{{ pad }} 0;border:0;background:transparent;cursor:pointer;text-align:left;font-size:16px;font-weight:700;line-height:22px;color:{% if forloop.first %}#FCC602{% else %}#FCF8F3{% endif %}"><span>{{ q.q }}</span><span data-faq-icon="1" style="flex-shrink:0;width:28px;height:28px;border-radius:4px;background:{% if forloop.first %}#FC8B01{% else %}rgba(252,248,243,.1){% endif %};color:{% if forloop.first %}#011E4F{% else %}#FCF8F3{% endif %};display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800">{% if forloop.first %}−{% else %}+{% endif %}</span></button>
  <div data-faq-answer="1" data-enter="1" {% if not forloop.first %}hidden{% endif %} style="padding:0 44px {{ pad }} 0;font-size:15px;line-height:23px;color:#C9D4E8;text-wrap:pretty">{{ q.a }}</div>
</div>
